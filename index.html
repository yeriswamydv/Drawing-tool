function parseRatio(str, fallback=1){
  if(!str || str === 'AUTO') return fallback;
  const p = str.split(':');
  if(p.length === 2 && +p[1]>0) return (+p[0]) / (+p[1]);
  return fallback;
}

function build(P, userSize='A3', scales={top:'AUTO', secA:'AUTO', secB:'AUTO', iso:'AUTO'}){
  const o = [];
  const S = [o];
  const [sheetW, sheetH] = SHEET_DIMS[userSize] || [420, 297];
  const isPrismatic = (P.shape === 'PRISMATIC' || P.shape === 'RECTANGULAR' || (P.length && P.width));
  const thk = +P.thk || 20;

  const L = (a,b,c,d,w=.3,s=0,col) => o.push({t:'p',p:[[a,b],[c,d]],w,s,c:col});
  const PL = (p,w=.3,s=0,z=1,f,col) => o.push({t:'p',p,w,s,z,f,c:col});
  const T = (x,y,x_,z=3,n='m',a=0,col,b) => o.push({t:'t',p:[x,y],x:x_,z,n,a,c:col,b});
  const Rc = (x,y,w,h,lw=.3,f,col) => PL([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],lw,0,1,f,col);
  const polar = (r,a0,a1,n=72) => Array.from({length:n+1},(_,i)=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return[r*Math.cos(a),r*Math.sin(a)]});
  const arrow = (x,y,ux,uy) => PL([[x,y],[x+ux*2.6-uy*.8,y+uy*2.6+ux*.8],[x+ux*2.6+uy*.8,y+uy*2.6-ux*.8]],.2,0,1,'#111111');

  function dim(x1,y1,x2,y2,off,txt){
    const dx=x2-x1, dy=y2-y1, l=Math.hypot(dx,dy);
    if(l<0.001) return;
    const ux=dx/l, uy=dy/l, nx=-uy, ny=ux, sg=Math.sign(off)||1;
    const a=[x1+nx*off, y1+ny*off], b=[x2+nx*off, y2+ny*off];
    L(x1+nx*1.5*sg, y1+ny*1.5*sg, a[0]+nx*2*sg, a[1]+ny*2*sg, 0.15);
    L(x2+nx*1.5*sg, y2+ny*1.5*sg, b[0]+nx*2*sg, b[1]+ny*2*sg, 0.15);
    L(a[0], a[1], b[0], b[1], 0.25);
    arrow(a[0], a[1], ux, uy); arrow(b[0], b[1], -ux, -uy);
    let ang = Math.atan2(-dy,dx)*180/Math.PI;
    if(ang>90) ang-=180; if(ang<-90) ang+=180;
    T((a[0]+b[0])/2+nx*sg*1.8, (a[1]+b[1])/2+ny*sg*1.8+(Math.abs(dx)>Math.abs(dy)?1:0), txt, 2.7, 'm', ang);
  }

  function hatch(pred,x0,y0,W,h,g=2.2){
    for(let k=-h; k<W; k+=g){
      let sg=[];
      const fl=()=>{if(sg.length>1) L(sg[0][0],sg[0][1],sg[sg.length-1][0],sg[sg.length-1][1],0.12); sg=[];};
      for(let t=0; t<=h; t+=0.5){
        const x=k+t, y=h-t;
        if(x>=0 && x<=W && pred(x,y)) sg.push([x0+x, y0+y]);
        else fl();
      }
      fl();
    }
  }

  const frame=()=>{
    const m = 10;
    Rc(m, m, sheetW - 2*m, sheetH - 2*m, 0.7);
    Rc(5, 5, sheetW - 10, sheetH - 10, 0.2);
    const nCols = 8, colW = (sheetW - 2*m) / nCols;
    for(let i=1; i<=nCols; i++){
      T(m + (i - 0.5)*colW, m - 1.4, i, 2.8);
      T(m + (i - 0.5)*colW, sheetH - m + 4.6, i, 2.8);
      if(i < nCols){
        L(m + i*colW, 5, m + i*colW, m, 0.2);
        L(m + i*colW, sheetH - m, m + i*colW, sheetH - 5, 0.2);
      }
    }
    const nRows = 4, rowH = (sheetH - 2*m) / nRows;

  let fin_mass = 0, blank_mass = 0, mass_red = 0;
  const H = P.holes || [];

  const od = +P.od || 0, bore = +P.bore || 0, pk = P.pockets;
  const rin = pk ? (+pk.rin || bore/2 + 25) : 0;
  const rout = pk ? (+pk.rout || od/2 - 18) : 0;
  const pi = (pk && pk.n) ? 360/pk.n : 0;
  const hw = r => (pk && pk.rib) ? (pi/2 - Math.asin((+pk.rib)/2/r)*180/Math.PI) : 0;
  const walk=(p,i,d,r)=>{let j=i,rem=r;for(;;){const k=(j+d+p.length)%p.length,sg=Math.hypot(p[k][0]-p[j][0],p[k][1]-p[j][1]);if(sg>=rem){const u=rem/sg;return[p[j][0]+(p[k][0]-p[j][0])*u,p[j][1]+(p[k][1]-p[j][1])*u]}rem-=sg;j=k}};
  function pocketPoly(i){

    const a=i*pi, p=polar(rout,a-hw(rout),a+hw(rout),12).concat(polar(rin,a+hw(rin),a-hw(rin),12)), cs=[0,12,13,25], out=[], rr=+pk.corner||8;
    p.forEach((q,k)=>{if(!cs.includes(k)){out.push(q);return;}const A=walk(p,k,-1,rr),B=walk(p,k,1,rr);for(let t=0;t<=6;t++){const u=t/6,v=1-u;out.push([v*v*A[0]+2*v*u*q[0]+u*u*B[0],v*v*A[1]+2*v*u*q[1]+u*u*B[1]])}});return out;
  }

  const hp = (!isPrismatic) ? H.flatMap(h=>{
    const q=+h.qty||1, an=h.angles||Array.from({length:q},(_,i)=>(+h.start||0)+i*360/q);
    return an.map(g=>({h,g,x:h.pcd/2*Math.cos(g*Math.PI/180), y:h.pcd/2*Math.sin(g*Math.PI/180)}));

  const cx = 110 * (sheetW / 420), cy = 118 * (sheetH / 297);

    PL(polar(od/2-3, 0, 360, 144).map(tf), 0.2);

    L(cx, cy-Rr-8, cx, cy+Rr+8, 0.15, 4);

    hp.forEach(p=>{

      for(const h of H){

    cuts.forEach(([n, a, sg])=>{

    T(cx, (202 * (sheetH/297)) + 4.5, 'SCALE ' + sc(topScale), 2.8);

    // =========================================================================
    // TRUE FULL-DIAMETER SECTIONS WITH INDIVIDUAL SCALE CONTROLS
    // =========================================================================
    const autoSecScale = pick((130 * (sheetW/420)) / od);
    const secScaleA = parseRatio(scales.secA, autoSecScale);
    const secScaleB = parseRatio(scales.secB, autoSecScale);

    const drawCircSec = (nm, a_deg, y0, sRatio) => {

      const step = 0.5;
      const poly = [];

    };

    const y0_A = 114 * (sheetH / 297);
    const y0_B = y0_A + thk*secScaleA + (32 * (sheetH / 297));
    drawCircSec(cuts[0][0], cuts[0][1], y0_A, secScaleA);
    drawCircSec(cuts[1][0], cuts[1][1], y0_B, secScaleB);

    const dn = +P.density || 2.81, kg = v => v/1e6 * dn;
    const Vs = Math.PI * (od/2)**2 * thk, Vb = Math.PI * (bore/2)**2 * thk;

    mass_red = (1 - fin_mass/blank_mass)*100;

  } else {
    // PRISMATIC PIPELINE
    const L_part = +P.length || 240, W_part = +P.width || 180;
    const leftX = cx - (L_part/2)*topScale, topY = cy - (W_part/2)*topScale;
    const wScaled = L_part * topScale, hScaled = W_part * topScale;

    L(leftX - 8, cy, leftX + wScaled + 8, cy, 0.15, 4);
    L(cx, topY - 8, cx, topY + hScaled + 8, 0.15, 4);

    const pks = P.pockets || [];
    pks.forEach(pk => {

    });

    dim(leftX, topY, leftX, topY + hScaled, 12, W_part + ' ' + (P.tolW||''));

    L(cutA_X, topY - 4, cutA_X, topY - 12, 0.8); L(cutA_X, topY - 12, cutA_X + 6, topY - 12, 0.3); arrow(cutA_X + 6, topY - 12, -1, 0); T(cutA_X + 9, topY - 11, 'A', 4, 'm', 0, 0, 1);
    L(cutA_X, topY + hScaled + 4, cutA_X, topY + hScaled + 12, 0.8); L(cutA_X, topY + hScaled + 12, cutA_X + 6, topY + hScaled + 12, 0.3); arrow(cutA_X + 6, topY + hScaled + 12, -1, 0); T(cutA_X + 9, topY + hScaled + 13, 'A', 4, 'm', 0, 0, 1);

    L(leftX - 10, cutB_Y, leftX + wScaled + 10, cutB_Y, 0.2, 5);

    L(leftX + wScaled + 4, cutB_Y, leftX + wScaled + 12, cutB_Y, 0.8); L(leftX + wScaled + 12, cutB_Y, leftX + wScaled + 12, cutB_Y - 6, 0.3); arrow(leftX + wScaled + 12, cutB_Y - 6, 0, 1); T(leftX + wScaled + 12, cutB_Y - 9, 'B', 4, 'm', 0, 0, 1);

    T(cx, 202 * (sheetH/297), 'TOP VIEW', 4.2, 'm', 0, 0, 1);
    T(cx, (202 * (sheetH/297)) + 4.5, 'SCALE ' + sc(topScale), 2.8);

    const autoSecScaleA = pick((130 * (sheetW/420)) / W_part);
    const autoSecScaleB = pick((130 * (sheetW/420)) / L_part);
    const secScaleA = parseRatio(scales.secA, autoSecScaleA);
    const secScaleB = parseRatio(scales.secB, autoSecScaleB);

    const secWA = W_part * secScaleA;
    const x0_A = (265 * (sheetW/420)) + ((130 * (sheetW/420)) - secWA)/2, y0_A = 114 * (sheetH/297);

    function drawPrismaticSectionA(){

      dim(x0_A, y0_A, x0_A, y0_A + thk*secScaleA, 10, thk + ' ' + (P.tolT||''));
      if(pkCut){
        dim(x0_A + secWA, y0_A + (+pkCut.depth)*secScaleA, x0_A + secWA, y0_A + thk*secScaleA, -8, (pkCut.floor||(thk-pkCut.depth)) + ' FLOOR');

    const secWB = L_part * secScaleB;
    const x0_B = (265 * (sheetW/420)) + ((130 * (sheetW/420)) - secWB)/2, y0_B = y0_A + thk*secScaleA + (32 * (sheetH/297));

    function drawPrismaticSectionB(){
      const pkCut = pks.find(p => (W_part/2) >= p.y && (W_part/2) <= (p.y + p.h));
      const poly = [];
      const step = 0.5;
      for(let x = 0; x <= L_part; x += step){

      poly.push([x0_B, y0_B + thk*secScaleB]);

      hatch((x, y)=>{
        const xCoord = x / secScaleB;
        let topY = (pkCut && xCoord >= pkCut.x && xCoord <= (pkCut.x + pkCut.w)) ? (+pkCut.depth)*secScaleB : 0;
        return y > topY + 0.01;
      }, x0_B, y0_B, secWB, thk*secScaleB);

      dim(x0_B, y0_B, x0_B, y0_B + thk*secScaleB, 10, thk + ' ' + (P.tolT||''));
      if(pkCut){
        dim(x0_B + secWB, y0_B + (+pkCut.depth)*secScaleB, x0_B + secWB, y0_B + thk*secScaleB, -8, (pkCut.floor||(thk-pkCut.depth)) + ' FLOOR');
      }

      T(x0_B, y0_B + thk*secScaleB + 7, 'SECTION B-B', 4.2, 'l', 0, 0, 1);
      T(x0_B + 38, y0_B + thk*secScaleB + 7, 'SCALE ' + sc(secScaleB) + ' (FULL LONGITUDINAL CUT)', 2.6, 'l');
    }

    drawPrismaticSectionA();
    drawPrismaticSectionB();

    const dn = +P.density || 2.81, kg = v => v/1e6 * dn;
    const Vs = L_part * W_part * thk;
    let Vp = pks.reduce((acc,pk)=> acc + pk.w * pk.h * pk.depth, 0);
    const Vh = H.reduce((acc,h)=> acc + (h.coords?.length||+h.qty||1) * Math.PI * (h.dia/2)**2 * (+h.depth||thk), 0);
    blank_mass = kg(Vs);
    fin_mass = kg(Vs - Vp - Vh);
    mass_red = (1 - fin_mass/blank_mass)*100;
  }

  // Mass Properties Box
  const f2 = v => v.toFixed(2);
  const mBoxX = 160 * (sheetW/420), mBoxY = sheetH - 52;
  T(mBoxX, mBoxY, 'MASS PROPERTIES (' + (P.material||'AL').split(' ')[0] + ')', 2.8, 'l', 0, 0, 1);
  [
    ['Solid blank size', f2(blank_mass) + ' kg'],
    ['Finished part mass', f2(fin_mass) + ' kg'],
    ['Mass reduction', mass_red.toFixed(1) + ' %']
  ].forEach((r,i)=>{
    const y = mBoxY + 3 + i*5.5;
    L(mBoxX, y, mBoxX + 65, y, 0.15);
    T(mBoxX + 1, y + 4, r[0], 2.3, 'l', 0, 0, i>0);
    T(mBoxX + 64, y + 4, r[1], 2.3, 'r', 0, 0, i>0);
  });
  L(mBoxX, mBoxY + 19.5, mBoxX + 65, mBoxY + 19.5, 0.15);

  // Notes
  const wrap=(t,n)=>{const w=[];let l='';t.split(' ').forEach(x=>{if((l+' '+x).length>n){w.push(l);l=x}else l=(l?l+' ':'')+x});w.push(l);return w};
  T(15, sheetH - 84, 'NOTES:', 3.2, 'l', 0, 0, 1);
  let ny = sheetH - 79.5;
  (P.notes||[]).forEach((t,i)=>wrap((i+1)+'. '+t.replace(/EVALUATED FINISHED MASS:.*kg/i,'EVALUATED FINISHED MASS: '+f2(fin_mass)+' kg'), 95).forEach(l=>{
    if(ny < sheetH - 54){ T(15, ny, l, 2.4, 'l'); ny += 3.4; }
  }));

  // Hole Table
  const hTableY = sheetH - 49;
  T(15, hTableY - 2, 'HOLE TABLE (' + (isPrismatic ? 'DATUM X0, Y0 AT BOTTOM-LEFT' : '0° = +X, CCW, FROM TOP') + ')', 2.8, 'l', 0, 0, 1);
  const cx2 = [15, 25, 35, 97, 111, 155].map(v => v * (sheetW/420)), ty = hTableY, rh = 9;
  Rc(15, ty, 140 * (sheetW/420), 6 + rh*H.length);
  L(15, ty+6, 155 * (sheetW/420), ty+6, 0.2);
  for(let c=1; c<5; c++) L(cx2[c], ty, cx2[c], ty+6+rh*H.length, 0.2);
  ['TAG','QTY','DESCRIPTION', isPrismatic?'PITCH / COORDS':'PCD', isPrismatic?'LOCATIONS':'ANGULAR POSITION'].forEach((t,c)=>T(cx2[c]+1.2, ty+4, t, 2.2, 'l', 0, 0, 1));
  H.forEach((h,i)=>{
    const y = ty + 6 + rh*i, q = h.coords?.length || +h.qty || 1, ls = (h.desc||'').split('|');
    if(i) L(15, y, 155 * (sheetW/420), y, 0.2);
    T(cx2[0] + 1.2, y + 5.2, h.tag, 2.4, 'l', 0, 0, 1);
    T(cx2[1] + 1.2, y + 5.2, q, 2.4, 'l');
    ls.slice(0, 2).forEach((t,j)=>T(cx2[2] + 1.2, y + 3.8 + j*3.3, t, 2.2, 'l'));
    T(cx2[3] + 1.2, y + 5.2, h.pcd ? ('Ø'+h.pcd) : (h.coords ? 'GRID' : '-'), 2.4, 'l');
    const posStr = h.angles ? h.angles.join('°, ')+'°' : (h.coords ? (q+'X MATRIX') : ((h.start||0)+'° START'));
    T(cx2[4] + 1.2, y + 5.2, posStr, 2.2, 'l');
  });

  // Title Block
  const W2 = 180, H2 = 47;
  const X = sheetW - 10 - W2, Y = sheetH - 10 - H2;
  const cell=(x,y,w,h,lb,v,z=3.4)=>{Rc(x,y,w,h,.3);T(x+1.2,y+2.8,lb,1.8,'l');T(x+1.2,y+h-2.2,String(v),z,'l')};
  Rc(X,Y,W2,H2,0.7); Rc(X,Y,W2,17,0.3);
  T(X+1.2, Y+2.8, 'TITLE', 1.8, 'l');
  T(X+W2/2, Y+8, P.title||'', 6.2, 'm', 0, 0, 1);
  T(X+W2/2, Y+13.8, P.subtitle||'', 2.8, 'm');
  cell(X, Y+17, 90, 10, 'PART NUMBER', P.partNumber||'', 4.2);
  cell(X+90, Y+17, 45, 10, 'REV', P.rev||'');
  cell(X+135, Y+17, 45, 10, 'SHEET', '1 OF 1');
  cell(X, Y+27, 90, 10, 'MATERIAL', P.material||'', 3);
  cell(X+90, Y+27, 45, 10, 'MASS (CALC.)', f2(fin_mass)+' kg', 2.8);
  cell(X+135, Y+27, 45, 10, 'SCALE', sc(topScale));
  cell(X, Y+37, 45, 10, 'SIZE', userSize);
  cell(X+45, Y+37, 90, 10, 'DRAWN / DATE', (P.drawn||'')+' / '+(P.date||''));
  cell(X+135, Y+37, 45, 10, 'PROJECTION', '1st (ISO)', 3);

  // 3D Isometric View
  function iso3d(){
    try {
      const T3 = window.THREE;
      if(!T3) return null;
      const cv = document.createElement('canvas'); cv.width = 900; cv.height = 700;
      const rd = new T3.WebGLRenderer({canvas:cv, antialias:true, preserveDrawingBuffer:true});
      rd.setClearColor(0xffffff); rd.setSize(900, 700, false);
      const scene = new T3.Scene();
      const geomMat = new T3.MeshLambertMaterial({color: 0xbfc5cd});
      const edgeMat = new T3.LineBasicMaterial({color: 0x222222});

      const addExt = (shape, z0, dz) => {
        const g = new T3.ExtrudeGeometry(shape, {depth: dz, bevelEnabled: false, curveSegments: 32});
        g.translate(0, 0, z0);
        scene.add(new T3.Mesh(g, geomMat));
        scene.add(new T3.LineSegments(new T3.EdgesGeometry(g, 30), edgeMat));
      };

      if(!isPrismatic){
        const fl = pk ? (+pk.floor || thk - pk.depth) : thk;
        const circ = (r,x=0,y=0) => polar(r,0,360,64).map(([a,b])=>new T3.Vector2(a+x, b+y));
        const baseSh = new T3.Shape(circ(od/2));
        if(bore) baseSh.holes.push(new T3.Path(circ(bore/2)));
        hp.forEach(p => baseSh.holes.push(new T3.Path(circ(p.h.dia/2, p.x, p.y))));
        addExt(baseSh, 0, fl);

        if(pk && thk > fl){
          const topSh = new T3.Shape(circ(od/2));
          if(bore) topSh.holes.push(new T3.Path(circ(bore/2)));
          for(let i=0; i<+pk.n; i++){
            topSh.holes.push(new T3.Path(pocketPoly(i).map(([a,b])=>new T3.Vector2(a,b))));
          }
          hp.forEach(p => {
            const r = Math.hypot(p.x, p.y);
            const ang = ((Math.atan2(p.y, p.x)*180/Math.PI)+360)%360;
            const da = Math.abs(((ang + pi/2)%pi + pi)%pi - pi/2);
            if(r <= rin || r >= rout || da >= hw(r)){
              topSh.holes.push(new T3.Path(circ(p.h.dia/2, p.x, p.y)));
            }
          });
          addExt(topSh, fl, thk - fl);
        }
      } else {
        const L_p = +P.length || 240, W_p = +P.width || 180;
        const pks = P.pockets || [];
        const baseSh = new T3.Shape([
          new T3.Vector2(-L_p/2, -W_p/2), new T3.Vector2(L_p/2, -W_p/2),
          new T3.Vector2(L_p/2, W_p/2), new T3.Vector2(-L_p/2, W_p/2)
        ]);
        if(pks.length > 0){
          const fl = pks[0].floor || (thk - pks[0].depth);
          addExt(baseSh, 0, fl);
          const topSh = new T3.Shape([
            new T3.Vector2(-L_p/2, -W_p/2), new T3.Vector2(L_p/2, -W_p/2),
            new T3.Vector2(L_p/2, W_p/2), new T3.Vector2(-L_p/2, W_p/2)
          ]);
          pks.forEach(pk => {
            const px = pk.x - L_p/2, py = pk.y - W_p/2;
            topSh.holes.push(new T3.Path([
              new T3.Vector2(px, py), new T3.Vector2(px + pk.w, py),
              new T3.Vector2(px + pk.w, py + pk.h), new T3.Vector2(px, py + pk.h)
            ]));
          });
          addExt(topSh, fl, thk - fl);
        } else {
          addExt(baseSh, 0, thk);
        }
      }

      const maxDiam = Math.max(od, (P.lugs?.reachRadius||od/2)*2, isPrismatic ? Math.max(P.length||240, P.width||180) : od);
      const totalEnvelope = Math.max(maxDiam, thk * 2.2);
      const isoMultiplier = scales.iso === 'AUTO' ? 1.0 : (+scales.iso || 1.0);
      const wCam = (totalEnvelope * 0.62) / isoMultiplier;

      const cam = new T3.OrthographicCamera(-wCam, wCam, wCam*700/900, -wCam*700/900, 1, totalEnvelope * 12);
      cam.up.set(0, 0, 1);
      cam.position.set(1.4, -1.8, 1.5).multiplyScalar(totalEnvelope * 1.5);
      cam.lookAt(0, 0, thk/2);
      scene.add(new T3.AmbientLight(0xffffff, 0.7));
      const dl = new T3.DirectionalLight(0xffffff, 0.8);
      dl.position.set(-1, -2, 3);
      scene.add(dl);
      rd.render(scene, cam);
      return cv.toDataURL('image/png');
    } catch(e) { return null; }
  }

  const isoX = sheetW - 10 - 130, isoY = 10;
  const img = iso3d();
  if(img) o.push({t:'i', p:[isoX, isoY, 115, 74], u:img});
  T(isoX + 57.5, isoY + 79, 'ISOMETRIC VIEW (NOT TO SCALE)', 3.2, 'm', 0, 0, 1);

  return { S, sheetW, sheetH };
}

function svg(res){
  const o = res.S[0], sheetW = res.sheetW, sheetH = res.sheetH;
  const f = n => +n.toFixed(2);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sheetW} ${sheetH}"><rect width="${sheetW}" height="${sheetH}" fill="#fff"/><g stroke-linejoin="round">`;
  o.forEach(e=>{
    if(e.t=='p') s+=`<${e.z?'polygon':'polyline'} points="${e.p.map(q=>f(q[0])+','+f(q[1])).join(' ')}" fill="${e.f||'none'}" stroke="${e.c||'#111111'}" stroke-width="${e.w}"${e.s?` stroke-dasharray="${e.s} ${e.s/2}"`:''}/>`;
    else if(e.t=='i') s+=`<image href="${e.u}" x="${e.p[0]}" y="${e.p[1]}" width="${e.p[2]}" height="${e.p[3]}"/>`;
    else s+=`<text x="${f(e.p[0])}" y="${f(e.p[1])}" font-size="${e.z}" fill="${e.c||'#111111'}" font-weight="${e.b?700:400}" font-family="Helvetica,Arial,sans-serif" text-anchor="${{l:'start',m:'middle',r:'end'}[e.n]}"${e.a?` transform="rotate(${-e.a} ${f(e.p[0])} ${f(e.p[1])})"`:''}>${String(e.x).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;
  });
  return s+'</g></svg>';
}

function pdf(res, sizeStr='a3'){
  const d = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format: sizeStr.toLowerCase()});
  const hx = c => [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  res.S.forEach((o,si)=>{
    if(si) d.addPage(sizeStr.toLowerCase(), 'landscape');
    o.forEach(e=>{
      if(e.t=='i') d.addImage(e.u, 'PNG', e.p[0], e.p[1], e.p[2], e.p[3]);
      else if(e.t=='p'){
        d.setLineWidth(e.w);
        d.setLineDashPattern(e.s?[e.s, e.s/2]:[], 0);
        d.setDrawColor(...hx(e.c||'#111111'));
        if(e.f) d.setFillColor(...hx(e.f));
        const p = e.p;
        d.lines(p.slice(1).map((q,i)=>[q[0]-p[i][0], q[1]-p[i][1]]), p[0][0], p[0][1], [1,1], e.f?'FD':'S', !!e.z);
      } else {
        d.setFont('helvetica', e.b?'bold':'normal');
        d.setTextColor(...hx(e.c||'#111111'));
        d.setFontSize(e.z * 2.835);
        d.text(String(e.x), e.p[0], e.p[1], {align:{l:'left',m:'center',r:'right'}[e.n], angle:e.a||0});
      }
    });
  });
  return d;
}

let curRes = null;
function render(){
  $('err').style.color='';
  try {
    const P = JSON.parse($('json').value);
    const sz = $('sheet_size').value;
    const scales = {
      top: $('scale_top').value,
      secA: $('scale_sec_a').value,
      secB: $('scale_sec_b').value,
      iso: $('scale_iso').value
    };
    curRes = build(P, sz, scales);
    $('prev').innerHTML = svg(curRes);
    $('err').textContent = 'Sheet successfully updated (' + (P.partNumber||'Part') + ' on ' + sz + ').';
    $('err').style.color = 'var(--ac)';
  } catch(e) {
    curRes = null;
    $('err').textContent = 'Error: ' + e.message;
    $('err').style.color = '#c0392b';
  }
}

$('part_select').onchange = ()=>{
  const sel = $('part_select').value;
  if(PRESETS[sel]){
    $('json').value = JSON.stringify(PRESETS[sel], null, 2);
    render();
  }
};

$('btn_save_preset').onclick = ()=>{
  try {
    const P = JSON.parse($('json').value);
    const customName = ($('custom_part_name').value.trim()) || (P.partNumber || P.title || 'Custom Part');
    const key = 'PRESET_' + Date.now();
    PRESETS[key] = P;
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = customName;
    opt.selected = true;
    $('part_select').appendChild(opt);
    $('err').textContent = 'Saved "' + customName + '" to presets menu!';
    $('err').style.color = 'var(--ac)';
  } catch(e) {
    $('err').textContent = 'Could not save preset: ' + e.message;
    $('err').style.color = '#c0392b';
  }
};

$('sheet_size').onchange = render;
$('scale_top').onchange = render;
$('scale_sec_a').onchange = render;
$('scale_sec_b').onchange = render;
$('scale_iso').onchange = render;
$('upd').onclick = render;

$('dl').onclick = ()=>{
  if(!curRes) return render();
  try {
    const P = JSON.parse($('json').value);
    const sz = $('sheet_size').value;
    pdf(curRes, sz).save((P.partNumber||'drawing') + '_' + sz + '.pdf');
  } catch(e) {
    $('err').textContent = 'Download failed: ' + e.message;
  }
};

$('part_select').value = 'PISTON';
$('json').value = JSON.stringify(PRESETS.PISTON, null, 2);
render();
</script>
