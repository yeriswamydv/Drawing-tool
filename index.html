<h1>Universal Drawing Sheet Generator (Circular &amp; Prismatic)</h1>
<p class="s">Generate professional ISO/ASME compliant A3 technical drawings for both circular parts (discs, rings, flanges) and rectangular/square parts (brackets, plates, manifolds) with true full-body section cuts.</p>

<script>
const $=id=>document.getElementById(id);
const STD=[1, 0.5, 0.4, 0.25, 0.2, 0.1, 0.05, 0.02], pick=r=>STD.find(s=>s<=r)||0.02, sc=s=>s>=1?'1:1':'1:'+(Math.round(1/s*100)/100);
const R2=v=>Math.round(v*100)/100;

const DEF_CIRC = {
  "shape": "CIRCULAR",
  "title": "LEVELING JACK FOOT",
  "subtitle": "SWIVEL LEVELING PAD & FOUNDATION ANCHOR BASE",
  "partNumber": "HL-MGSE-P06",
  "rev": "P3 (FULL-SECTION)",
  "material": "AL 7075-T6",
  "density": 2.81,
  "od": 220,
  "thk": 42,
  "bore": 45,
  "tolOD": "±0.20",
  "tolT": "±0.10",
  "tolBore": "±0.03",
  "pockets": {
    "n": 3,
    "depth": 22,
    "floor": 20,
    "rib": 22,
    "corner": 8,
    "rin": 40,
    "rout": 88
  },
  "holes": [
    {
      "tag": "A",
      "qty": 4,
      "dia": 18.0,
      "pcd": 175,
      "start": 45,
      "step": 90,
      "desc": "Ø18.0 THRU|4X EQUISPACED ON Ø175 PCD (FOR M16 FLOOR ANCHORS)"
    },
    {

      "qty": 3,
      "dia": 6.8,
      "depth": 16.0,
      "thread": "M8 × 1.25 × 12 DP",
      "pcd": 130,
      "angles": [60, 180, 300],
      "desc": "M8 × 1.25 × 12 DP|DRILL Ø6.8 × 16 DP (3X IN RIBS AT 60°, 180°, 300°)"
    }
  ],
  "notes": [
    "ALL DIMENSIONS IN MILLIMETRES. DO NOT SCALE DRAWING.",
    "MATERIAL: AL 7075-T6 (AMS 4045 / ASTM B209).",
    "UNTOLERANCED DIMENSIONS PER ISO 2768-m.",
    "BREAK ALL SHARP EDGES 0.5 × 45°. DEBURR AND CLEAN.",
    "BASE CONTACT SURFACE FLATNESS: 0.05 mm TIR.",
    "CENTRAL BORE Ø45.0 ACCEPTS SPHERICAL STUD LEVELING SPINDLE.",
    "SURFACE TREATMENT: MIL-A-8625 TYPE III HARD ANODIZE, CLASS 1 CLEAR (50 µm).",
    "3X RIBS 22.0 WIDE EQUISPACED AT 120° (AT 60°, 180°, 300°).",
    "EVALUATED FINISHED MASS: 3.18 kg."
  ],
  "drawn": "v3",
  "date": "2026-11-05"
};

const DEF_RECT = {
  "shape": "PRISMATIC",
  "title": "TRUNNION BASE ADAPTER BLOCK",
  "subtitle": "HEAVY HANDLING MGSE MOUNTING SADDLE",
  "partNumber": "HL-MGSE-P07",
  "rev": "P1 (INITIAL)",
  "material": "AL 7075-T6",
  "density": 2.81,
  "length": 260,
  "width": 180,
  "thk": 38,
  "corner_radius": 12,
  "tolL": "±0.15",
  "tolW": "±0.15",
  "tolT": "±0.10",
  "pockets": [
    { "x": 30, "y": 25, "w": 200, "h": 130, "depth": 22, "floor": 16, "corner": 8, "desc": "RECESS POCKET 22 DP, 16 FLOOR" }
  ],
  "holes": [
    {
      "tag": "A",
      "qty": 4,
      "dia": 14.0,
      "cbore": { "dia": 20.0, "depth": 13.0 },
      "coords": [[18, 18], [242, 18], [242, 162], [18, 162]],
      "desc": "Ø14.0 THRU, C'BORE Ø20.0 × 13.0 DP|4X CORNER TIE-DOWN BOLTS"
    },
    {
      "tag": "B",
      "qty": 2,
      "dia": 10.0,
      "depth": 20.0,
      "coords": [[130, 20], [130, 160]],
      "desc": "Ø10.0 H7 REAMED × 20.0 DP|2X TRANSVERSE ALIGNMENT DOWELS"
    },
    {
      "tag": "C",
      "qty": 4,
      "dia": 8.5,
      "depth": 22.0,
      "thread": "M10 × 1.5 × 16 DP",
      "coords": [[90, 90], [170, 90], [90, 90], [170, 90]],
      "desc": "M10 × 1.5 × 16 DP|DRILL Ø8.5 × 22 DP (4X PAYLOAD INTERFACE)"
    }
  ],
  "notes": [
    "ALL DIMENSIONS IN MILLIMETRES. DO NOT SCALE DRAWING.",
    "MATERIAL: AL 7075-T6 (AMS 4045 / ASTM B209).",
    "UNTOLERANCED DIMENSIONS PER ISO 2768-m.",
    "BREAK ALL SHARP EDGES 0.5 × 45°. DEBURR AND CLEAN.",
    "DATUM A (BOTTOM BASE) FLATNESS: 0.03 mm.",
    "SURFACE TREATMENT: MIL-A-8625 TYPE III HARD ANODIZE (50 µm).",
    "EVALUATED FINISHED MASS: 3.52 kg."
  ],
  "drawn": "v1",
  "date": "2026-11-05"
};

function build(P){
  const o = [];
  const S = [o];
  const isPrismatic = (P.shape === 'PRISMATIC' || P.shape === 'RECTANGULAR' || (P.length && P.width));
  const thk = +P.thk || 20;

  // Drawing helpers
  const L = (a,b,c,d,w=.3,s=0,col) => o.push({t:'p',p:[[a,b],[c,d]],w,s,c:col});
  const PL = (p,w=.3,s=0,z=1,f,col) => o.push({t:'p',p,w,s,z,f,c:col});
  const T = (x,y,x_,z=3,n='m',a=0,col,b) => o.push({t:'t',p:[x,y],x:x_,z,n,a,c:col,b});
  const Rc = (x,y,w,h,lw=.3,f,col) => PL([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],lw,0,1,f,col);
  const polar = (r,a0,a1,n=72) => Array.from({length:n+1},(_,i)=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return[r*Math.cos(a),r*Math.sin(a)]});
  const arrow = (x,y,ux,uy) => PL([[x,y],[x+ux*2.6-uy*.8,y+uy*2.6+ux*.8],[x+ux*2.6+uy*.8,y+uy*2.6-ux*.8]],.2,0,1,'#111111');

  function dim(x1,y1,x2,y2,off,txt){
    const dx=x2-x1, dy=y2-y1, l=Math.hypot(dx,dy);
    if(l<0.001) return;
    const ux=dx/l, uy=dy/l, nx=-uy, ny=ux, sg=Math.sign(off)||1;
    const a=[x1+nx*off, y1+ny*off], b=[x2+nx*off, y2+ny*off];
    L(x1+nx*1.5*sg, y1+ny*1.5*sg, a[0]+nx*2*sg, a[1]+ny*2*sg, 0.15);
    L(x2+nx*1.5*sg, y2+ny*1.5*sg, b[0]+nx*2*sg, b[1]+ny*2*sg, 0.15);
    L(a[0], a[1], b[0], b[1], 0.25);
    arrow(a[0], a[1], ux, uy);
    arrow(b[0], b[1], -ux, -uy);
    let ang = Math.atan2(-dy,dx)*180/Math.PI;
    if(ang>90) ang-=180; if(ang<-90) ang+=180;
    T((a[0]+b[0])/2+nx*sg*1.8, (a[1]+b[1])/2+ny*sg*1.8+(Math.abs(dx)>Math.abs(dy)?1:0), txt, 2.7, 'm', ang);
  }

  function hatch(pred,x0,y0,W,h,g=2.2){
    for(let k=-h; k<W; k+=g){
      let sg=[];
      const fl=()=>{if(sg.length>1) L(sg[0][0],sg[0][1],sg[sg.length-1][0],sg[sg.length-1][1],0.12); sg=[];};
      for(let t=0; t<=h; t+=0.5){
        const x=k+t, y=h-t;
        if(x>=0 && x<=W && pred(x,y)) sg.push([x0+x, y0+y]);
        else fl();
      }
      fl();
    }
  }

  // Draw A3 Sheet Frame & Grid Coordinates
  const frame=()=>{
    Rc(10,10,400,277,0.7); Rc(5,5,410,287,0.2);
    for(let i=1;i<=8;i++){
      T(10+(i-.5)*50, 8.6, i, 2.8); T(10+(i-.5)*50, 291.6, i, 2.8);
      if(i<8){ L(10+i*50, 5, 10+i*50, 10, 0.2); L(10+i*50, 287, 10+i*50, 292, 0.2); }
    }
    'ABCD'.split('').forEach((c,j)=>{
      const y=10+(j+.5)*69.25+1;
      T(7.5, y, c, 2.8); T(412.5, y, c, 2.8);
      if(j<3){ L(5, 10+(j+1)*69.25, 10, 10+(j+1)*69.25, 0.2); L(410, 10+(j+1)*69.25, 415, 10+(j+1)*69.25, 0.2); }
    });
  };
  frame();

  let topScale = 1;
  let fin_mass = 0, blank_mass = 0, mass_red = 0;
  const H = P.holes || [];

  if(!isPrismatic){
    // =========================================================================
    // CIRCULAR PIPELINE WITH TRUE FULL-DIAMETER SECTIONS
    // =========================================================================
    const od = +P.od, bore = +P.bore||0, pk = P.pockets;
    const maxDim = Math.max(od, (P.lugs?.reachRadius||od/2)*2);
    topScale = pick(150 / maxDim);
    const cx = 110, cy = 118, Rr = od/2*topScale;
    const tf = ([x,y]) => [cx + x*topScale, cy - y*topScale];
    const pt = (r,a) => tf([r*Math.cos(a*Math.PI/180), r*Math.sin(a*Math.PI/180)]);

    // Draw Top View
    PL(polar(od/2, 0, 360, 144).map(tf), 0.6);
    PL(polar(od/2-3, 0, 360, 144).map(tf), 0.2);
    if(bore) PL(polar(bore/2, 0, 360, 120).map(tf), 0.6);

    // Lugs
    const lugs = P.lugs;
    if(lugs){
      (lugs.angles||[0,120,240]).forEach(la=>{
        const cr=+lugs.pinCenterRadius||(od/2), nr=+lugs.lugNoseRadius||25;
        const an=la*Math.PI/180, cos=Math.cos(an), sin=Math.sin(an);
        const lcx=cr*cos, lcy=cr*sin;
        const arcPts=polar(nr, la+90, la-90, 24).map(([x,y])=>[lcx+x, lcy+y]);
        PL(arcPts.map(tf), 0.6);
        const phR = (+lugs.pinHoleDia||25)/2;
        PL(polar(phR, 0, 360, 24).map(([x,y])=>tf([lcx+x, lcy+y])), 0.3);
      });
    }

    // Pockets
    const rin = pk ? (+pk.rin || bore/2 + 25) : 0;
    const rout = pk ? (+pk.rout || od/2 - 18) : 0;
    const pi = pk ? 360/pk.n : 0;
    const hw = r => pi/2 - Math.asin((+pk.rib||14)/2/r)*180/Math.PI;
    const walk=(p,i,d,r)=>{let j=i,rem=r;for(;;){const k=(j+d+p.length)%p.length,sg=Math.hypot(p[k][0]-p[j][0],p[k][1]-p[j][1]);if(sg>=rem){const u=rem/sg;return[p[j][0]+(p[k][0]-p[j][0])*u,p[j][1]+(p[k][1]-p[j][1])*u]}rem-=sg;j=k}};
    function pocketPoly(i){
      const a=i*pi, p=polar(rout,a-hw(rout),a+hw(rout),12).concat(polar(rin,a+hw(rin),a-hw(rin),12)), cs=[0,12,13,25], out=[], rr=+pk.corner||8;
      p.forEach((q,k)=>{if(!cs.includes(k)){out.push(q);return;}const A=walk(p,k,-1,rr),B=walk(p,k,1,rr);for(let t=0;t<=6;t++){const u=t/6,v=1-u;out.push([v*v*A[0]+2*v*u*q[0]+u*u*B[0],v*v*A[1]+2*v*u*q[1]+u*u*B[1]])}});return out;
    }
    if(pk) for(let i=0; i<+pk.n; i++) PL(pocketPoly(i).map(tf), 0.45);

    // Centerlines
    L(cx-Rr-10, cy, cx+Rr+14, cy, 0.15, 4);
    L(cx, cy-Rr-8, cx, cy+Rr+8, 0.15, 4);

    // Hole rendering
    const hp = H.flatMap(h=>{
      const q=+h.qty||1, an=h.angles||Array.from({length:q},(_,i)=>(+h.start||0)+i*360/q);
      return an.map(g=>({h,g,x:h.pcd/2*Math.cos(g*Math.PI/180), y:h.pcd/2*Math.sin(g*Math.PI/180)}));
    });
    H.forEach(h=>PL(polar(h.pcd/2, 0, 360, 120).map(tf), 0.15, 3));
    hp.forEach(p=>{
      PL(polar(p.h.dia/2, 0, 360, 16).map(([a,b])=>tf([a+p.x, b+p.y])), 0.3);
      if(p.h.cbore) PL(polar(p.h.cbore.dia/2, 0, 360, 16).map(([a,b])=>tf([a+p.x, b+p.y])), 0.25);
    });

    // Top view dimensions
    const yd = cy - Rr - 12;
    L(cx-Rr, cy, cx-Rr, yd-2, 0.15); L(cx+Rr, cy, cx+Rr, yd-2, 0.15);
    L(cx-Rr, yd, cx+Rr, yd, 0.25); arrow(cx-Rr, yd, 1, 0); arrow(cx+Rr, yd, -1, 0);
    T(cx, yd-1.5, 'Ø'+od+' '+(P.tolOD||''), 3.2);
    if(bore){
      const p1=pt(bore/2, 140), p2=pt(bore/2, -40);
      L(p1[0], p1[1], p2[0], p2[1], 0.25); arrow(p1[0], p1[1], .766, .643); arrow(p2[0], p2[1], -.766, -.643);
      T(cx+2, cy-4, 'Ø'+bore+' BORE', 2.8, 'm', -40);
    }
    // PCD Callouts
    H.forEach((h,i)=>{
      if(!h.pcd) return;
      const aDim = 150 - i*28, leadP = pt(h.pcd/2, aDim), outP = pt(h.pcd/2+14+i*4, aDim);
      L(leadP[0], leadP[1], outP[0], outP[1], 0.2);
      arrow(leadP[0], leadP[1], Math.cos(aDim*Math.PI/180), -Math.sin(aDim*Math.PI/180));
      const txX = Math.max(14, outP[0]-14);
      L(outP[0], outP[1], txX, outP[1], 0.2);
      T(txX-1.5, outP[1]+1, 'Ø'+h.pcd+' PCD ('+h.tag+')', 2.5, 'r');
    });

    // Rib / Pocket dimensions on Top view
    if(pk){
      const pIn=pt(rin, 215), pOut=pt(rout, 235);
      L(pIn[0], pIn[1], pIn[0]-14, pIn[1]+8, 0.2); arrow(pIn[0], pIn[1], .88, .47);
      T(pIn[0]-16, pIn[1]+9, 'Rin '+rin, 2.4, 'r');
      L(pOut[0], pOut[1], pOut[0]-14, pOut[1]+8, 0.2); arrow(pOut[0], pOut[1], .88, .47);
      T(pOut[0]-16, pOut[1]+9, 'Rout '+rout, 2.4, 'r');

      if(pk.rib){
        const ribAng = (180/pk.n)*Math.PI/180, midR = (rin+rout)/2*topScale;
        const perpX = -Math.sin(ribAng), perpY = Math.cos(ribAng), halfW = (pk.rib/2)*topScale;
        const pA = [cx + Math.cos(ribAng)*midR - perpX*halfW, cy - Math.sin(ribAng)*midR - perpY*halfW];
        const pB = [cx + Math.cos(ribAng)*midR + perpX*halfW, cy - Math.sin(ribAng)*midR + perpY*halfW];
        dim(pA[0], pA[1], pB[0], pB[1], -14, pk.rib+' RIB WIDTH');
      }
      T(14, 38, pk.n+'X POCKET '+pk.depth+' DP', 2.6, 'l');
      T(14, 42, 'R'+(pk.corner||8)+' CORNERS, '+(pk.floor||(thk-pk.depth))+' FLOOR', 2.6, 'l');
    }

    // Cutting Plane Arrows (Outer diameter strictly)
    let cutA_ang = 90, cutB_ang = 0;
    if(pk){
      cutB_ang = 0;
      const ribAng = 180/pk.n, ribAngles = Array.from({length:pk.n},(_,idx)=>ribAng+idx*(360/pk.n));
      cutA_ang = ribAng;
      for(const h of H){
        const an=h.angles||[(+h.start||0)];
        const m=an.find(ang=>ribAngles.some(ra=>Math.abs(((ang-ra+180)%360+360)%360-180)<6));
        if(m!==undefined){ cutA_ang = m; break; }
      }
    }
    const cuts = [['A', cutA_ang, 1], ['B', cutB_ang, -1]];
    cuts.forEach(([n, a, sg])=>{
      const rad = a * Math.PI / 180, c = Math.cos(rad), sn = Math.sin(rad);
      const dx = c, dy = -sn, nx = -dy*sg, ny = dx*sg;
      // Both sides of the full diameter cutting plane:
      [-1, 1].forEach(dir=>{
        const r1 = dir * (Rr + 2), r2 = dir * (Rr + 9);
        const mx = cx + dx * r2, my = cy + dy * r2;
        L(cx + dx * r1, cy + dy * r1, mx, my, 0.9);
        L(mx, my, mx + nx * 8, my + ny * 8, 0.3);
        arrow(mx + nx * 8, my + ny * 8, -nx, -ny);
        T(mx + nx * 11.5, my + ny * 11.5 + 1.3, n, 4, 'm', 0, 0, 1);
      });
      // Cutting plane dashed line across part
      L(cx - dx*Rr, cy - dy*Rr, cx + dx*Rr, cy + dy*Rr, 0.2, 5);
    });

    T(cx, 202, 'TOP VIEW', 4.2, 'm', 0, 0, 1);
    T(cx, 206.5, 'SCALE ' + sc(topScale), 2.8);

    // =========================================================================
    // TRUE FULL-DIAMETER SECTION CUTS (EDGE TO EDGE: -OD/2 to +OD/2)
    // =========================================================================
    // Available section width is 135mm (X=260 to X=395). We scale full diameter:
    const secScale = pick(130 / od);
    const secW = od * secScale;
    const x0 = 265 + (130 - secW)/2;
    const y0_A = 114;
    const y0_B = y0_A + thk*secScale + 26;

    function drawFullCircSection(nm, a_deg, y0){
      const a = a_deg * Math.PI / 180;
      // We sample points across the full diameter from u = -od/2 to +od/2
      const step = 0.5;
      const poly = [];
      const inPocketAt = (u) => {
        if(!pk) return false;
        const r = Math.abs(u);
        if(r < rin || r > rout) return false;
        const ang = u >= 0 ? a_deg : (a_deg + 180) % 360;
        const da = Math.abs(((ang + pi/2)%pi + pi)%pi - pi/2);
        return da < hw(r);
      };

      // Top profile of cut:
      for(let u = -od/2; u <= od/2; u += step){
        const r = Math.abs(u);
        let topY = 0;
        if(bore && r < bore/2){
          topY = thk; // hollow bore
        } else if(inPocketAt(u)){
          topY = +pk.depth;
        }
        poly.push([x0 + (u + od/2)*secScale, y0 + topY*secScale]);
      }
      poly.push([x0 + secW, y0 + thk*secScale]);
      poly.push([x0, y0 + thk*secScale]);
      PL(poly, 0.5);

      // Hatching solid material (where topY < thk)
      hatch((x, y)=>{
        const u = x/secScale - od/2;
        const r = Math.abs(u);
        if(bore && r < bore/2) return false;
        let topY = inPocketAt(u) ? (+pk.depth)*secScale : 0;
        return y > topY + 0.01;
      }, x0, y0, secW, thk*secScale);

      // Centerline at bore axis
      const xCenter = x0 + (od/2)*secScale;
      L(xCenter, y0 - 4, xCenter, y0 + thk*secScale + 4, 0.15, 4);

      // Holes cutting through this section
      const holesInCut = H.filter(h => {
        const an = h.angles || Array.from({length:+h.qty||1},(_,i)=>(+h.start||0)+i*360/(+h.qty||1));

function svg(o){

function pdf(S){
  const d = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a3'});
  const hx = c => [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  S.forEach((o,si)=>{
    if(si) d.addPage('a3','landscape');
    o.forEach(e=>{
      if(e.t=='i') d.addImage(e.u, 'PNG', e.p[0], e.p[1], e.p[2], e.p[3]);
      else if(e.t=='p'){
        d.setLineWidth(e.w);
        d.setLineDashPattern(e.s?[e.s, e.s/2]:[], 0);
        d.setDrawColor(...hx(e.c||'#111111'));
        if(e.f) d.setFillColor(...hx(e.f));
        const p = e.p;
        d.lines(p.slice(1).map((q,i)=>[q[0]-p[i][0], q[1]-p[i][1]]), p[0][0], p[0][1], [1,1], e.f?'FD':'S', !!e.z);
      } else {
        d.setFont('helvetica', e.b?'bold':'normal');
        d.setTextColor(...hx(e.c||'#111111'));
        d.setFontSize(e.z * 2.835);
        d.text(String(e.x), e.p[0], e.p[1], {align:{l:'left',m:'center',r:'right'}[e.n], angle:e.a||0});
      }
    });
  });
  return d;
}

let ops = null;
function render(){
  $('err').style.color='';
  try {
    const P = JSON.parse($('json').value);
    ops = build(P);
    $('prev').innerHTML = ops.map(svg).join('<div style="height:12px"></div>');
    $('err').textContent = 'Drawing rendered successfully.';
    $('err').style.color = 'var(--ac)';
  } catch(e) {
    ops = null;
    $('err').textContent = 'Error: ' + e.message;
    $('err').style.color = '#c0392b';
  }
}

$('json').value = JSON.stringify(DEF_CIRC, null, 2);
render();

$('upd').onclick = render;
$('load_p06').onclick = ()=>{ $('json').value = JSON.stringify(DEF_CIRC, null, 2); render(); };
$('load_rect').onclick = ()=>{ $('json').value = JSON.stringify(DEF_RECT, null, 2); render(); };
$('dl').onclick = ()=>{
  if(!ops) return render();
  try {
    const P = JSON.parse($('json').value);
    pdf(ops).save((P.partNumber||'drawing') + '.pdf');
  } catch(e) {
    $('err').textContent = 'Download failed: ' + e.message;
  }
};
